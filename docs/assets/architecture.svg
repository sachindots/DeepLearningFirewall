<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b93ff"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#4a5170"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="14" fill="#0c0e13"/>
  <text x="30" y="40" fill="#e9eaee" font-size="17" font-weight="600">Deep Learning Firewall — request classification pipeline</text>

  <g font-size="12.5" text-anchor="middle">
    <!-- stages -->
    <g>
      <rect x="30" y="110" width="130" height="72" rx="10" fill="#14161d" stroke="#222632"/>
      <text x="95" y="140" fill="#e9eaee" font-weight="600">HTTP request</text>
      <text x="95" y="160" fill="#9aa0ac" font-size="11">method · url · body</text>
    </g>
    <g>
      <rect x="192" y="110" width="130" height="72" rx="10" fill="#14161d" stroke="#222632"/>
      <text x="257" y="138" fill="#e9eaee" font-weight="600">canonicalize</text>
      <text x="257" y="157" fill="#9aa0ac" font-size="11">url-decode +</text>
      <text x="257" y="171" fill="#9aa0ac" font-size="11">flatten to text</text>
    </g>
    <g>
      <rect x="354" y="110" width="120" height="72" rx="10" fill="#14161d" stroke="#222632"/>
      <text x="414" y="138" fill="#e9eaee" font-weight="600">char encode</text>
      <text x="414" y="157" fill="#9aa0ac" font-size="11">+ embedding</text>
      <text x="414" y="171" fill="#9aa0ac" font-size="11">1024 × 64</text>
    </g>
    <!-- conv block -->
    <g>
      <rect x="506" y="86" width="150" height="120" rx="10" fill="#131826" stroke="#323847"/>
      <text x="581" y="106" fill="#a78bfa" font-weight="600">TextCNN</text>
      <rect x="520" y="118" width="122" height="20" rx="5" fill="#191c24" stroke="#222632"/><text x="581" y="132" fill="#cdd2e0" font-size="11">Conv1D · k=3</text>
      <rect x="520" y="143" width="122" height="20" rx="5" fill="#191c24" stroke="#222632"/><text x="581" y="157" fill="#cdd2e0" font-size="11">Conv1D · k=5</text>
      <rect x="520" y="168" width="122" height="20" rx="5" fill="#191c24" stroke="#222632"/><text x="581" y="182" fill="#cdd2e0" font-size="11">Conv1D · k=7</text>
    </g>
    <g>
      <rect x="688" y="110" width="120" height="72" rx="10" fill="#14161d" stroke="#222632"/>
      <text x="748" y="138" fill="#e9eaee" font-weight="600">pool + dense</text>
      <text x="748" y="157" fill="#9aa0ac" font-size="11">global max</text>
      <text x="748" y="171" fill="#9aa0ac" font-size="11">→ sigmoid</text>
    </g>
    <g>
      <rect x="840" y="110" width="92" height="72" rx="10" fill="none" stroke="url(#acc)" stroke-width="1.5"/>
      <text x="886" y="140" fill="url(#acc)" font-weight="700">allow /</text>
      <text x="886" y="160" fill="url(#acc)" font-weight="700">block</text>
    </g>

    <!-- arrows -->
    <g stroke="#4a5170" stroke-width="1.5" marker-end="url(#arw)">
      <line x1="160" y1="146" x2="188" y2="146"/>
      <line x1="322" y1="146" x2="350" y2="146"/>
      <line x1="474" y1="146" x2="502" y2="146"/>
      <line x1="656" y1="146" x2="684" y2="146"/>
      <line x1="808" y1="146" x2="836" y2="146"/>
    </g>
  </g>

  <text x="30" y="250" fill="#6a7180" font-size="12">Multi-width convolutions act as learnable n-gram detectors — a width-5 filter learns the shape of tokens like</text>
  <text x="30" y="270" fill="#6a7180" font-size="12" font-family="monospace">union select · &lt;script&gt; · ../.. · ' OR '1'='1</text>
</svg>
